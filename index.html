<script>
/* 原創教學題，並非國考歷屆試題；可自行在此檔增加題目。answer 使用 0–3。 */
window.QUESTION_BANK = [
  {id:'P01',subject:'藥理',topic:'交感神經',question:'病人有氣喘病史，需要控制心悸時，下列哪種 β 阻斷劑最應避免？',options:['Metoprolol','Propranolol','Bisoprolol','Atenolol'],answer:1,explain:'Propranolol 為非選擇性 β1/β2 阻斷劑，抑制 β2 可能誘發支氣管收縮。',why:['較偏 β1 選擇性，仍須審慎使用。','正解：非選擇性 β 阻斷。','較偏 β1 選擇性，仍不是零風險。','較偏 β1 選擇性，仍須評估。']},
  {id:'P02',subject:'藥理',topic:'急救用藥',question:'嚴重過敏反應（Anaphylaxis）合併低血壓與喘鳴，第一線藥物與主要給藥途徑為何？',options:['口服抗組織胺','肌肉注射 Epinephrine','吸入類固醇','靜脈注射 Furosemide'],answer:1,explain:'首選立即肌肉注射 Epinephrine（大腿前外側），並同步處理氣道與循環。',why:['只屬輔助治療，起效較慢。','正解：及時處理氣道水腫與休克。','不能取代 Epinephrine。','利尿劑不治療過敏性休克。']},
  {id:'P03',subject:'藥理',topic:'心臟藥理',question:'下列何種電解質異常通常會增加 Digoxin（毛地黃）毒性的風險？',options:['高血鈉','低血鉀','高血鎂','高血氯'],answer:1,explain:'低血鉀可增加 Digoxin 與 Na+/K+-ATPase 的結合，提升中毒風險。',why:['非典型關鍵因子。','正解：低鉀與 Digoxin 競爭結合位點。','非此題標準答案。','非典型關鍵因子。']},
  {id:'P04',subject:'藥理',topic:'抗凝血',question:'Warfarin 的主要作用機轉是什麼？',options:['直接抑制凝血酶','抑制維生素 K 環氧化物還原酶','活化 Plasminogen','阻斷血小板 P2Y12'],answer:1,explain:'Warfarin 抑制 VKORC1，使維生素 K 依賴性凝血因子 II、VII、IX、X 的活化減少。',why:['這是直接凝血酶抑制劑的機轉。','正解。','屬於溶栓機轉。','是 Clopidogrel 等藥的機轉。']},
  {id:'P05',subject:'藥理',topic:'抗凝血',question:'未分劃肝素（Unfractionated heparin）的抗凝作用主要依賴？',options:['增加 Antithrombin 活性','抑制維生素 K 回收','直接阻斷 P2Y12','破壞 Fibrin 血栓'],answer:0,explain:'肝素增強 Antithrombin 作用，進而抑制凝血因子 IIa 與 Xa。',why:['正解：UFH 透過 Antithrombin。','屬 Warfarin 機轉。','屬抗血小板藥。','屬纖維蛋白溶解，不是肝素。']},
  {id:'P06',subject:'藥理',topic:'降血壓藥',question:'使用 ACE inhibitor 後出現乾咳，最相關的物質累積為何？',options:['Histamine','Bradykinin','Dopamine','Aldosterone'],answer:1,explain:'ACE 同時參與 Bradykinin 降解；被抑制後 Bradykinin 累積，可能造成乾咳或血管性水腫。',why:['不是典型 ACEI 乾咳原因。','正解。','不是典型機轉。','ACEI 主要使 Aldosterone 減少。']},
  {id:'P07',subject:'藥理',topic:'抗菌藥',question:'MRSA 菌血症需全身性抗菌治療時，下列哪項通常是合理的初始選擇之一？',options:['Vancomycin','Azithromycin','Amoxicillin 單方','Metronidazole'],answer:0,explain:'Vancomycin 是 MRSA 菌血症常用初始選擇之一；須考量腎功能、藥物暴露與菌株敏感性。',why:['正解：可覆蓋 MRSA。','一般不作 MRSA 菌血症首選。','對多數 MRSA 無效。','主要針對厭氧菌。']},
  {id:'P08',subject:'藥理',topic:'抗菌藥',question:'Aminoglycoside（胺基醣苷類）最具代表性的兩種毒性為？',options:['肝毒性與光敏感','腎毒性與耳毒性','骨髓抑制與溶血','胰臟炎與低血糖'],answer:1,explain:'胺基醣苷類常見重要不良反應為腎毒性與耳毒性，且有神經肌肉阻斷風險。',why:['不是最經典配對。','正解。','並非典型配對。','並非典型配對。']},
  {id:'P09',subject:'藥理',topic:'中毒處置',question:'有機磷農藥中毒導致流口水、瞳孔縮小、支氣管分泌物增加，主要解毒治療包含？',options:['Atropine 加 Pralidoxime','Naloxone 加 N-acetylcysteine','Flumazenil 單獨使用','Protamine 單獨使用'],answer:0,explain:'Atropine 拮抗毒蕈鹼症狀；Pralidoxime 可在適當時機再活化乙醯膽鹼酯酶，並需優先支持呼吸道。',why:['正解。','分別用於 opioid / acetaminophen 中毒。','為 BZD 拮抗劑且可能誘發癲癇。','用於肝素逆轉。']},
  {id:'P10',subject:'藥理',topic:'中毒處置',question:'Acetaminophen（乙醯胺酚）過量中毒，特異性解毒劑是？',options:['Vitamin K','N-acetylcysteine','Deferoxamine','Atropine'],answer:1,explain:'N-acetylcysteine 可補充 Glutathione 來源，促進 NAPQI 解毒；是否給藥依暴露時間、濃度與臨床情況決定。',why:['用於部分凝血異常與 Warfarin 逆轉。','正解。','用於鐵中毒。','用於膽鹼性毒性。']},
  {id:'P11',subject:'藥理',topic:'中毒處置',question:'疑似 Opioid（鴉片類）過量，出現意識下降與呼吸抑制，優先使用哪種拮抗劑？',options:['Flumazenil','Naloxone','Physostigmine','Fomepizole'],answer:1,explain:'Naloxone 為 Opioid 受體拮抗劑；同時需支援呼吸與氣道，並持續監測再度呼吸抑制。',why:['用於部分 BZD 中毒，但有風險。','正解。','用於特定抗膽鹼毒性情境。','用於甲醇、乙二醇中毒。']},
  {id:'P12',subject:'藥理',topic:'鎮靜麻醉',question:'Benzodiazepine（苯二氮平類）主要如何增強 GABA-A 受體作用？',options:['延長氯離子通道開啟時間','增加氯離子通道開啟頻率','直接阻斷 NMDA','抑制 GABA 合成'],answer:1,explain:'Benzodiazepine 增加 GABA-A 氯離子通道開啟頻率；Barbiturate 典型為延長開啟時間。',why:['較符合 Barbiturate。','正解。','不是 BZD 機轉。','作用方向相反。']},
  {id:'P13',subject:'藥理',topic:'糖尿病用藥',question:'Metformin（雙胍類）降低血糖的主要作用包括？',options:['刺激胰島 β 細胞直接釋放 Insulin','減少肝臟糖質新生','抑制腸道脂肪酶','直接活化 GLP-1 受體'],answer:1,explain:'Metformin 主要減少肝臟葡萄糖生成並改善胰島素敏感性，本身很少造成低血糖。',why:['較接近 Sulfonylurea 機轉。','正解。','屬 Orlistat。','屬 GLP-1 receptor agonist。']},
  {id:'P14',subject:'藥理',topic:'降血脂',question:'Statin（史他汀）抑制膽固醇合成的哪個酵素？',options:['HMG-CoA reductase','Lipoprotein lipase','Pancreatic lipase','HMG-CoA lyase'],answer:0,explain:'Statin 抑制 HMG-CoA reductase，降低肝臟膽固醇合成並增加 LDL receptor 表現。',why:['正解。','與三酸甘油酯清除相關。','與腸道脂肪吸收相關。','是酮體生成相關酵素。']},
  {id:'B01',subject:'生化',topic:'醣類代謝',question:'Von Gierke disease（肝醣儲積症 I 型）典型缺陷是？',options:['Glucose-6-phosphatase 系統','Muscle glycogen phosphorylase','Lysosomal acid α-glucosidase','Branching enzyme'],answer:0,explain:'GSD I 與葡萄糖-6-磷酸酶系統缺陷相關，典型見嚴重空腹低血糖、乳酸與尿酸升高。',why:['正解。','是 McArdle disease（V 型）。','是 Pompe disease（II 型）。','是 Andersen disease（IV 型）。']},
  {id:'B02',subject:'生化',topic:'內分泌代謝',question:'Glucagon 刺激肝醣分解的典型訊息傳遞路徑為？',options:['Gs → cAMP → PKA','Gi → cAMP 下降','RTK → PI3K','Gq → IP3 單一路徑'],answer:0,explain:'Glucagon 主要經 Gs、adenylyl cyclase、cAMP、PKA 促進肝醣分解並抑制合成。',why:['正解。','與 Glucagon 典型路徑相反。','更典型的是 Insulin receptor。','不是主要路徑。']},
  {id:'B03',subject:'生化',topic:'糖解作用',question:'與 Hexokinase 相比，肝臟 Glucokinase（葡萄糖激酶）的特性為何？',options:['較低 Km、較容易飽和','較高 Km、適合高血糖時處理葡萄糖','被 G6P 強烈回饋抑制','主要存在成熟紅血球'],answer:1,explain:'Glucokinase 具有較高 Km，主要在肝臟與胰臟 β 細胞，適合感測與處理較高濃度的葡萄糖。',why:['更像 Hexokinase。','正解。','Glucokinase 不受 G6P 的典型回饋抑制。','成熟紅血球以 Hexokinase 為主。']},
  {id:'B04',subject:'生化',topic:'維生素',question:'Pyruvate dehydrogenase（丙酮酸去氫酶）複合體需要哪組輔因子？',options:['B1、B2、B3、B5、Lipoate','僅 Vitamin C 與 K','B6、B12 與 Folate','僅 Biotin 與 ATP'],answer:0,explain:'PDH 複合體需 TPP(B1)、FAD(B2)、NAD+(B3)、CoA(B5) 與 Lipoic acid。',why:['正解。','並非 PDH 的完整組合。','不是此複合體的組合。','Biotin 主要與羧化酶有關。']},
  {id:'B05',subject:'生化',topic:'電子傳遞鏈',question:'Cyanide（氰化物）中毒主要抑制粒線體哪個電子傳遞複合體？',options:['Complex I','Complex II','Complex III','Complex IV'],answer:3,explain:'氰化物抑制 Cytochrome c oxidase（Complex IV），阻斷氧作為最終電子受體。',why:['主要處理 NADH 電子。','Succinate dehydrogenase。','Cytochrome bc1。','正解。']},
  {id:'B06',subject:'生化',topic:'尿素循環',question:'男性嬰兒高血氨且尿中 Orotic acid 上升，最可能缺乏？',options:['Ornithine transcarbamylase（OTC）','Carbamoyl phosphate synthetase II','Arginase','Phenylalanine hydroxylase'],answer:0,explain:'OTC 缺陷為 X-linked，氨升高且 Carbamoyl phosphate 轉入嘧啶合成使 Orotic acid 升高。',why:['正解。','CPS II 屬嘧啶合成，非典型尿素循環缺陷。','可致高精胺酸血症，表現不同。','造成 PKU，不是典型高血氨。']},
  {id:'B07',subject:'生化',topic:'尿素循環',question:'CPS I（Carbamoyl phosphate synthetase I）的重要變構活化劑為？',options:['N-acetylglutamate','Fructose-2,6-bisphosphate','Citrate','Malonyl-CoA'],answer:0,explain:'N-acetylglutamate（NAG）是尿素循環第一步 CPS I 的必要活化劑。',why:['正解。','調控 PFK-1 與糖解作用。','調控多種能量代謝，非 CPS I 必要活化劑。','主要抑制 CPT I。']},
  {id:'B08',subject:'生化',topic:'胺基酸代謝',question:'典型 Phenylketonuria（PKU）的主要酵素缺陷為？',options:['Tyrosinase','Phenylalanine hydroxylase','Homogentisate oxidase','Cystathionine β-synthase'],answer:1,explain:'經典 PKU 多因 Phenylalanine hydroxylase 缺陷，需限制 Phenylalanine 並維持適當營養。',why:['缺陷造成某些白化症。','正解。','缺陷造成 Alkaptonuria。','缺陷造成典型 Homocystinuria。']},
  {id:'B09',subject:'生化',topic:'胺基酸代謝',question:'Maple syrup urine disease（楓糖尿症）缺乏下列哪個酵素複合體？',options:['Branched-chain α-ketoacid dehydrogenase','Pyruvate carboxylase','HGPRT','Galactose-1-phosphate uridyltransferase'],answer:0,explain:'MSUD 缺乏支鏈 α-酮酸去氫酶，無法正常分解 Leucine、Isoleucine 與 Valine。',why:['正解。','屬糖質新生反應。','涉及嘌呤回收。','是典型半乳糖血症缺陷。']},
  {id:'B10',subject:'生化',topic:'維生素',question:'維生素 B12 缺乏與 Folate 缺乏的實驗室鑑別，何者更支持 B12 缺乏？',options:['Homocysteine 上升','Methylmalonic acid 上升','MCV 上升','Megaloblastic anemia'],answer:1,explain:'B12 缺乏可使 Methylmalonic acid 升高，Folate 缺乏通常不會；其餘三項可能兩者都有。',why:['兩者都可升高。','正解。','兩者都可出現。','兩者皆可能。']},
  {id:'B11',subject:'生化',topic:'醣類代謝',question:'新生兒開始攝取牛奶後出現黃疸、肝功能異常與白內障，典型 Galactosemia 常見缺陷為？',options:['GALT','Aldolase B','Fructokinase','Lactase'],answer:0,explain:'典型半乳糖血症因 GALT 缺乏，須及早停止攝入 Galactose/Lactose 並進一步評估。',why:['正解。','缺乏導致遺傳性果糖不耐症。','缺乏導致多屬良性的基本型果糖尿症。','缺乏常見為乳糖不耐症。']},
  {id:'B12',subject:'生化',topic:'血液生化',question:'G6PD 缺乏者使用某些氧化壓力藥物後溶血，關鍵問題是紅血球無法產生足夠的？',options:['NADPH','NADH','ATP','Acetyl-CoA'],answer:0,explain:'G6PD 位於磷酸戊糖途徑，產生 NADPH 以維持還原型 Glutathione，保護紅血球免受氧化傷害。',why:['正解。','不是主要的 Glutathione 保護還原力。','紅血球 ATP 主要源自糖解作用。','紅血球無粒線體，與此不符。']},
  {id:'B13',subject:'生化',topic:'嘌呤代謝',question:'Lesch–Nyhan syndrome 的酵素缺陷是？',options:['HGPRT','ADA','Xanthine oxidase','Orotate phosphoribosyltransferase'],answer:0,explain:'HGPRT 缺乏影響嘌呤回收，典型有高尿酸、神經行為異常與自傷行為。',why:['正解。','缺乏可導致免疫不全。','受 Allopurinol 抑制。','缺乏可能導致 Orotic aciduria。']},
  {id:'B14',subject:'生化',topic:'醣類代謝',question:'Hereditary fructose intolerance（遺傳性果糖不耐症）主要缺陷為？',options:['Fructokinase','Aldolase B','Galactokinase','Hexokinase'],answer:1,explain:'Aldolase B 缺陷導致 Fructose-1-phosphate 累積，可造成嚴重低血糖與肝傷害。',why:['缺乏屬較良性的 Essential fructosuria。','正解。','缺乏可導致半乳糖代謝問題。','不是典型病因。']},
  {id:'A01',subject:'解剖',topic:'上肢神經',question:'肱骨骨幹中段骨折後出現手腕下垂（Wrist drop），最可能受損的神經為？',options:['Median nerve','Radial nerve','Ulnar nerve','Axillary nerve'],answer:1,explain:'Radial nerve 走行於肱骨橈神經溝，損傷使手腕與手指伸肌無力。',why:['典型影響部分屈肌與魚際肌。','正解。','典型影響骨間肌與小指側感覺。','多見於外科頸損傷。']},
  {id:'A02',subject:'解剖',topic:'上肢神經',question:'肱骨外科頸骨折、三角肌無力且肩外側感覺降低，最可能受損？',options:['Axillary nerve','Radial nerve','Musculocutaneous nerve','Long thoracic nerve'],answer:0,explain:'Axillary nerve 繞行肱骨外科頸，支配 Deltoid，負責肩外展約 15–90 度的重要動作。',why:['正解。','骨幹中段骨折較典型。','主要支配前臂屈肌及上臂前側。','造成翼狀肩胛。']},
  {id:'A03',subject:'解剖',topic:'上肢神經',question:'腕隧道症候群（Carpal tunnel syndrome）主要壓迫哪條神經？',options:['Ulnar nerve','Radial nerve','Median nerve','Axillary nerve'],answer:2,explain:'Median nerve 穿過腕隧道，常致拇、食、中指與無名指橈側麻木；魚際隆起皮膚感覺可能保留。',why:['多在 Guyon canal 或肘部受壓。','不是腕隧道內神經。','正解。','與肩部相關。']},
  {id:'A04',subject:'解剖',topic:'上肢神經',question:'肘部附近尺神經損傷，最可能造成哪種典型手部表現？',options:['Wrist drop','第 4、5 指爪狀變形與骨間肌無力','三角肌麻痺','翼狀肩胛'],answer:1,explain:'Ulnar nerve 支配多數手內在肌，損傷可致第 4、5 指爪狀與手指外展、內收無力；爪狀程度依傷口高低而異。',why:['典型 Radial nerve。','正解。','典型 Axillary nerve。','典型 Long thoracic nerve。']},
  {id:'A05',subject:'解剖',topic:'上肢神經',question:'推牆時出現明顯翼狀肩胛（Winged scapula），首先考慮哪條神經受損？',options:['Long thoracic nerve','Suprascapular nerve','Axillary nerve','Median nerve'],answer:0,explain:'Long thoracic nerve 支配 Serratus anterior，損傷造成翼狀肩胛。',why:['正解。','支配棘上/棘下肌。','支配三角肌與小圓肌。','支配前臂與魚際等肌。']},
  {id:'A06',subject:'解剖',topic:'頭頸解剖',question:'甲狀腺手術後出現聲音沙啞，最須留意哪條神經損傷？',options:['Recurrent laryngeal nerve','Hypoglossal nerve','Phrenic nerve','Greater auricular nerve'],answer:0,explain:'Recurrent laryngeal nerve 支配多數喉內肌，損傷可能造成聲帶麻痺與聲音沙啞。',why:['正解。','主要支配舌肌。','支配橫膈。','頸部皮膚感覺神經。']},
  {id:'A07',subject:'解剖',topic:'頭頸解剖',question:'甲狀腺手術後無法唱高音，可能與外喉上神經支配哪條肌肉受損有關？',options:['Posterior cricoarytenoid','Cricothyroid','Thyroarytenoid','Lateral cricoarytenoid'],answer:1,explain:'External branch of superior laryngeal nerve 支配 Cricothyroid muscle，使聲帶張緊、提升音調。',why:['由 Recurrent laryngeal nerve 支配。','正解。','主要由 Recurrent laryngeal nerve 支配。','主要由 Recurrent laryngeal nerve 支配。']},
  {id:'A08',subject:'解剖',topic:'下肢解剖',question:'股三角（Femoral triangle）由外向內的構造順序為何？',options:['Nerve → Artery → Vein → Lymphatics','Vein → Artery → Nerve → Lymphatics','Artery → Nerve → Vein → Lymphatics','Nerve → Vein → Artery → Lymphatics'],answer:0,explain:'股三角外到內記憶口訣 NAVL：股神經、股動脈、股靜脈、淋巴。',why:['正解。','顛倒順序。','神經應在動脈外側。','動靜脈順序錯誤。']},
  {id:'A09',subject:'解剖',topic:'腹股溝',question:'直接型腹股溝疝氣（Direct inguinal hernia）相對於下腹壁動脈的位置為？',options:['外側','內側','一定在股靜脈下方','位於閉孔'],answer:1,explain:'直接型腹股溝疝氣穿過 Hesselbach 三角，位於 Inferior epigastric vessels 內側。',why:['間接型通常位於外側。','正解。','不是股疝的典型位置描述。','不是腹股溝疝。']},
  {id:'A10',subject:'解剖',topic:'腹股溝',question:'間接型腹股溝疝氣（Indirect inguinal hernia）經過深腹股溝環，位於下腹壁動脈的哪一側？',options:['內側','外側','正後方','與血管位置無關'],answer:1,explain:'間接型疝氣由深腹股溝環進入，位於 Inferior epigastric vessels 外側。',why:['直接型在內側。','正解。','不是標準關係。','動脈正是重要解剖定位。']},
  {id:'A11',subject:'解剖',topic:'淋巴引流',question:'睪丸（Testis）惡性腫瘤首先常沿淋巴回流至？',options:['淺腹股溝淋巴結','腹主動脈旁（腰部）淋巴結','腋下淋巴結','鎖骨上淋巴結'],answer:1,explain:'睪丸源於後腹壁，淋巴主要回流至 Para-aortic (lumbar) nodes；陰囊皮膚則多至淺腹股溝結。',why:['較符合陰囊皮膚。','正解。','不是主要第一站。','不是主要第一站。']},

  {id:'A13',subject:'解剖',topic:'呼吸解剖',question:'橫膈神經（Phrenic nerve）的主要脊髓節段為？',options:['C1–C2','C3–C5','T1–T4','L1–L3'],answer:1,explain:'Phrenic nerve 主要來自 C3、C4、C5，支配橫膈。口訣 C3, 4, 5 keep the diaphragm alive。',why:['過高。','正解。','胸髓不是主要來源。','腰髓不是主要來源。']},
  {id:'A14',subject:'解剖',topic:'骨科解剖',question:'跌倒以手掌撐地後鼻煙窩（Anatomical snuffbox）壓痛，最應懷疑哪塊骨折？',options:['Pisiform','Scaphoid','Hamate','Capitate'],answer:1,explain:'舟狀骨（Scaphoid）骨折常有鼻煙窩壓痛，初期 X 光可能看不清；須妥善固定並評估影像，以免近端骨缺血性壞死。',why:['豌豆骨疼痛位置不同。','正解。','鉤骨可因球棒握持受傷。','不是最典型。']}
];

<script>
'use strict';
/* Clerk Studio v1.0 — no analytics SDK, external network, or patient identifiers. */
const KEY = 'clerk-studio-v1';
const BANK = window.QUESTION_BANK || [];
const SUBJECTS = ['全部','藥理','生化','解剖'];
const CATEGORIES = ['病歷','課程','臨床技能','行政','其他'];
const pageNames = {home:'你的學習，井然有序。',study:'國考智慧複習',clerk:'Clerk 輪訓任務',analytics:'自動統計與分析'};
const defaultDB = () => ({version:1,study:{records:{},history:[],bookmarks:[]},clerk:{tasks:[],rotations:[]}});
const clone = x => JSON.parse(JSON.stringify(x));
function readDB(){try{const v=JSON.parse(localStorage.getItem(KEY)); if(v&&v.version===1&&v.study&&v.clerk&&Array.isArray(v.study.history)&&Array.isArray(v.clerk.tasks)&&Array.isArray(v.clerk.rotations))return v;}catch(_){ }return defaultDB();}
let db=readDB();
const ui={page:'home',subject:'小兒科',studyMode:'official1152',activeQ:null,answer:null,sessionSeen:[],taskFilter:'pending',taskForm:false,editTask:null,rotationForm:false,editRotation:null,csv:null,csvDate:'',csvValue:'',csvGroup:'',csvStatus:'全部',csvOperation:'sum'};
const E=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $$=(s)=>document.querySelector(s);
const uid=()=>globalThis.crypto?.randomUUID?.()||`id-${Date.now()}-${Math.floor(Math.random()*1e6)}`;
function localDay(date=new Date()){return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;}
function addDay(day,n){const d=new Date(`${day}T12:00:00`);d.setDate(d.getDate()+n);return localDay(d);}
function fmtDay(day){if(!day)return '未設定';const a=day.split('-');return a.length===3?`${Number(a[1])}/${Number(a[2])}`:day;}
function dateDiff(from,to){return Math.round((new Date(to+'T12:00:00')-new Date(from+'T12:00:00'))/86400000);}
function normDate(s){let t=String(s??'').trim();const m=t.match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);if(!m)return '';const y=+m[1],mo=+m[2],d=+m[3];const x=new Date(y,mo-1,d);return x.getFullYear()===y&&x.getMonth()+1===mo&&x.getDate()===d?localDay(x):'';}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true;}catch(e){toast('無法寫入瀏覽器儲存空間，請下載備份或檢查設定。');return false;}}
function toast(msg){const el=$$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast._id);toast._id=setTimeout(()=>el.classList.remove('show'),3200);}
function download(name,content,type='text/plain;charset=utf-8'){const b=new Blob([content],{type});const url=URL.createObjectURL(b);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function toCSV(rows){return '\ufeff'+rows.map(r=>r.map(c=>{let s=String(c??'');if(!Number.isFinite(Number(s))&&/^[\s]*[=+@\-]/.test(s))s="'"+s;return /[",\r\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s;}).join(',')).join('\r\n');}
const pct=(a,b)=>b?Math.round(a/b*100):0;
const isDue=r=>!r?.due||r.due<=localDay();
function studyStats(){const h=db.study.history,correct=h.filter(x=>x.correct).length, today=h.filter(x=>x.date===localDay()),due=BANK.filter(q=>isDue(db.study.records[q.id])).length;return {total:h.length,correct,today:today.length,due,accuracy:pct(correct,h.length),wrong:BANK.filter(q=>(db.study.records[q.id]?.wrong||0)>0).length};}
function taskStats(){const t=db.clerk.tasks,done=t.filter(x=>x.done).length,open=t.filter(x=>!x.done),late=open.filter(x=>x.due&&x.due<localDay()).length,today=open.filter(x=>x.due===localDay()).length;return{total:t.length,done,open:open.length,late,today,rate:pct(done,t.length)};}
function render(){document.title=`${pageNames[ui.page]}｜Clerk Studio`;$$('#page-heading').textContent=pageNames[ui.page];$$('#today-display').textContent=new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'short',day:'numeric',weekday:'short'}).format(new Date());document.querySelectorAll('[data-page]').forEach(x=>{x.classList.toggle('active',x.dataset.page===ui.page);if(x.dataset.page===ui.page)x.setAttribute('aria-current','page');else x.removeAttribute('aria-current');});$$('#app').innerHTML=({home:renderHome,study:renderStudy,clerk:renderClerk,analytics:renderAnalytics}[ui.page])();}
function button(label,action,cls='ghost small',extra=''){return `<button type="button" class="${cls}" data-action="${E(action)}" ${extra}>${label}</button>`;}
function empty(label,hint){return `<div class="empty"><span class="empty-icon">◌</span><strong>${E(label)}</strong><p>${E(hint)}</p></div>`;}
function statCard(label,n,hint,cls=''){return `<div class="card metric"><span class="label">${label}</span><b class="number num ${cls}">${E(n)}</b><span class="hint">${hint}</span></div>`;}
function bars(data){const max=Math.max(1,...data.map(x=>Math.abs(x.value)));return `<div class="bar-chart">${data.map(x=>`<div class="bar-col" title="${E(x.label)}：${E(x.value)}"><div class="bar" style="height:${Math.max(2,Math.round(Math.abs(x.value)/max*116))}px;background:${x.color||'#58bfae'}"></div><small>${E(x.label)}</small></div>`).join('')}</div>`;}
function lastSeven(){const keys=Array.from({length:7},(_,i)=>addDay(localDay(),i-6));return keys.map(day=>({label:fmtDay(day),value:db.study.history.filter(h=>h.date===day).length}));}
function nextTasks(limit=4){return db.clerk.tasks.filter(t=>!t.done).slice().sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')||priorityN(b.priority)-priorityN(a.priority)).slice(0,limit);}
function currentRotation(){const t=localDay();return db.clerk.rotations.find(r=>r.start<=t&&r.end>=t);}
function renderHome(){const s=studyStats(),t=taskStats(),r=currentRotation();return `<section class="hero"><div><span class="eyebrow">YOUR DAILY DASHBOARD</span><h2>每天前進一點，<br>累積成真正的實力。</h2><p>把國考複習、臨床輪訓與數據整理放在同一個地方。資料只儲存在你的瀏覽器。</p><div class="btn-row">${button('開始今日複習 →','go-study','primary mint')}${button('新增今日任務','new-task','outline')}</div></div><div class="hero-visual"><b>${s.due}</b><span>目前待複習題數</span></div></section>
  <div class="stats-grid">${statCard('今日已練習',s.today+' 題','累積 '+s.total+' 次作答')}${statCard('累積正確率',s.accuracy+'%','答對 '+s.correct+' / '+s.total)}${statCard('待處理任務',t.open+' 項',t.late?'其中 '+t.late+' 項逾期':'無逾期',t.late?'warn':'')}${statCard('目前輪訓',r?r.name:'尚未設定',r?fmtDay(r.start)+'–'+fmtDay(r.end):'可在輪訓頁新增')}</div>
  <div class="section-row"><h2>三個核心工作區</h2><span class="badge green">READY TO USE</span></div><div class="grid g3"><article class="card feature-card"><div class="feature-icon">✳</div><div><h3>國考智慧複習</h3><p>42 題原創藥理、生化、解剖練習題。提供選項解析、錯題本、收藏與間隔複習。</p></div>${button('前往題庫 →','go-study','feature-link')}</article><article class="card feature-card"><div class="feature-icon">▤</div><div><h3>Clerk 輪訓任務</h3><p>安排 SOAP、晨會、臨床技能與表單截止日；支援優先級、重複任務、輪科時間軸及行事曆匯出。</p></div>${button('管理輪訓 →','go-clerk','feature-link')}</article><article class="card feature-card"><div class="feature-icon">▥</div><div><h3>自動統計與分析</h3><p>自動整合國考與任務進度；可讀取 CSV、按類別彙總、分析趨勢、產出圖表與報表。</p></div>${button('查看報表 →','go-analytics','feature-link')}</article></div>
  <div class="grid g2" style="margin-top:19px"><section class="card"><div class="card-head"><div><h2>近 7 天練習量</h2><p>依實際作答紀錄自動更新</p></div>${button('檢視分析 ↗','go-analytics')}</div>${bars(lastSeven())}</section><section class="card"><div class="card-head"><div><h2>即將處理的任務</h2><p>依到期時間與優先級排序</p></div>${button('所有任務 ↗','go-clerk')}</div>${nextTasks().length?`<div class="list">${nextTasks().map(t=>`<div class="list-row"><div><div class="title">${E(t.title)}</div><div class="meta">${E(t.category)} · ${t.due?fmtDay(t.due):'無截止日'}</div></div>${t.due<localDay()?'<span class="badge red">逾期</span>':'<span class="badge blue">待辦</span>'}</div>`).join('')}</div>`:empty('今天從第一項任務開始','到輪訓任務頁新增 SOAP、課程或表單提醒。')}</section></div><div class="wide-note" style="margin-top:18px">🔐 <b>隱私提醒：</b>本站無伺服器帳號與雲端同步，請只記錄匿名學習及工作資訊，不要輸入病人姓名、病歷號、生日等可識別資訊。定期使用「備份與還原」保存紀錄。</div>`;}
function questionPool(){return BANK.filter(q=>{if(ui.subject!=='全部'&&q.subject!==ui.subject)return false;const kind=q.kind==='official-derived';const modes={all:true,due:isDue(db.study.records[q.id]),wrong:(db.study.records[q.id]?.wrong||0)>0,bookmark:db.study.bookmarks.includes(q.id),official:kind,official1152:kind&&q.sourceExam==='115年第二次',official1151:kind&&q.sourceExam==='115年第一次',official1142:kind&&q.sourceExam==='114年第二次',official1141:kind&&q.sourceExam==='114年第一次',original:!kind};return Boolean(modes[ui.studyMode]);});}
function pickQuestion(){const pool=questionPool();const fresh=pool.filter(q=>!ui.sessionSeen.includes(q.id));const list=fresh.length?fresh:pool;if(!list.length){ui.activeQ=null;ui.answer=null;return;}const q=list[Math.floor(Math.random()*list.length)];ui.activeQ=q.id;ui.answer=null;ui.sessionSeen.push(q.id);if(ui.sessionSeen.length>150)ui.sessionSeen.shift();}
function renderStudy(){const s=studyStats();const curr=BANK.find(q=>q.id===ui.activeQ);const pool=questionPool();const qRecord=curr?db.study.records[curr.id]:null;return `<div class="info-strip">📖 題庫共 <b>${BANK.length} 題</b>，優先提供考選部近年「醫學(四)」兒科考點<b>重新編寫</b>的練習題。題目與選項不等於官方原卷，仍可點連結核對官方題本、更新後標準答案。臨床處置應以最新指引為準。</div>
  <div class="stats-grid">${statCard('題庫總數',BANK.length+' 題',SUBJECTS.filter(n=>n!=='全部').map(n=>n+' '+BANK.filter(q=>q.subject===n).length).join(' · '))}${statCard('待複習',s.due+' 題','依答題間隔排程')}${statCard('答錯過的題目',s.wrong+' 題','可以集中複習')}${statCard('總正確率',s.accuracy+'%','作答 '+s.total+' 次')}</div>
  <section class="card"><div class="card-head"><div><h2>出題設定</h2><p>建議每天先做「今日待複習」</p></div>${button('↓ 答題紀錄 CSV','export-study')}</div><div class="controls"><div class="pill-tabs" aria-label="科目">${SUBJECTS.map(n=>`<button type="button" data-subject="${n}" class="${ui.subject===n?'active':''}">${n}</button>`).join('')}</div><div class="field" style="min-width:160px"><select id="study-mode" aria-label="題庫模式"><option value="official1152" ${ui.studyMode==='official1152'?'selected':''}>🔥 115-2 最新國考考點</option><option value="official1151" ${ui.studyMode==='official1151'?'selected':''}>115-1 國考考點</option><option value="official1142" ${ui.studyMode==='official1142'?'selected':''}>114-2 國考考點</option><option value="official1141" ${ui.studyMode==='official1141'?'selected':''}>114-1 國考考點</option><option value="official" ${ui.studyMode==='official'?'selected':''}>近兩年國考改寫（全部）</option><option value="due" ${ui.studyMode==='due'?'selected':''}>今日待複習</option><option value="original" ${ui.studyMode==='original'?'selected':''}>純原創延伸練習</option><option value="all" ${ui.studyMode==='all'?'selected':''}>全部題庫</option><option value="wrong" ${ui.studyMode==='wrong'?'selected':''}>答錯過的題目</option><option value="bookmark" ${ui.studyMode==='bookmark'?'selected':''}>我的收藏</option></select></div></div><div class="btn-row"><span class="badge blue">目前符合條件 ${pool.length} 題</span>${button(curr?'換一題 ↻':'開始練習 →','next-question','primary')}${curr?button('停止本輪','stop-question'):''}</div></section>
  ${curr?`<section class="card question" style="margin-top:17px"><div class="question-top"><div class="tag-cloud"><span class="badge green">${E(curr.subject)}</span><span class="badge">${E(curr.topic)}</span><span class="badge">${E(curr.id)}</span>${curr.kind==='official-derived'?`<span class="badge blue">考選部 ${E(curr.sourceExam)}・原題 #${E(curr.officialQNo)} 考點改寫</span>`:''}</div><button class="ghost small" data-action="toggle-bookmark">${db.study.bookmarks.includes(curr.id)?'★ 已收藏':'☆ 收藏題目'}</button></div><h3>${E(curr.question)}</h3><div class="question-options">${curr.options.map((v,i)=>`<button type="button" class="choice ${ui.answer!==null?(i===curr.answer?'correct':i===ui.answer?'wrong':''):''}" data-answer="${i}" ${ui.answer!==null?'disabled':''}><span class="letter">${'ABCD'[i]}</span><span>${E(v)}</span></button>`).join('')}</div>${ui.answer!==null?`<div class="answer-panel"><strong>${ui.answer===curr.answer?'✅ 答對了！':'📝 這題要再記一次'}　標準答案：${'ABCD'[curr.answer]}</strong><p>${E(curr.explain)}</p><b>選項解析</b><ol type="A" class="rationale-list">${curr.why.map(x=>`<li>${E(x)}</li>`).join('')}</ol>${curr.source?`<p class="help" style="margin-top:12px">${curr.kind==='official-derived'?'考點對照（題幹與選項均已重新編寫）：':'醫學參考資料：'} <a href="${E(curr.source)}" target="_blank" rel="noopener noreferrer">查看${curr.kind==='official-derived'?'考選部官方原題 PDF（題號 '+E(curr.officialQNo)+'）':'原始參考資料'} ↗</a>${curr.answerSource?`　·　<a href="${E(curr.answerSource)}" target="_blank" rel="noopener noreferrer">官方最終答案 ↗</a>（原題答案 ${E(curr.officialKey)}；與本站選項順序不同）`:''}</p>`:''}<div class="divider"></div><div class="btn-row"><span class="badge green">下次複習：${E(fmtDay(db.study.records[curr.id]?.due))}</span>${button('下一題 →','next-question','primary')}</div></div>`:`<p class="help" style="margin-top:16px">作答後會立即顯示詳解與每個選項的判讀。</p>`}${qRecord?`<p class="help" style="margin-top:14px">此題累積答對 ${qRecord.right||0} 次、答錯 ${qRecord.wrong||0} 次</p>`:''}</section>`:`<section class="card" style="margin-top:17px">${empty(pool.length?'準備好開始練習了！':'目前沒有符合條件的題目',pool.length?'點擊「開始練習」挑選一題。':'可以改成全部題庫，或選其他科目。')}</section>`}
  <section class="card" style="margin-top:17px"><div class="card-head"><div><h2>學習方式</h2><p>簡易間隔重複，不是經過個人化驗證的預測演算法</p></div></div><div class="grid g3"><div><b>答錯 → 隔天再看</b><p class="help">下次到期設在隔天，連續答對次數歸零。</p></div><div><b>答對 → 拉長間隔</b><p class="help">連續答對後依序間隔約 1、3、7、14、30 天。</p></div><div><b>進度可備份</b><p class="help">每次答題均記錄到本機，建議定期匯出 JSON。</p></div></div></section>`;}

function parseCSV(text){text=String(text).replace(/^\ufeff/,'');const sample=text.split(/\r?\n/,1)[0];const delim=sample.includes('\t')?'\t':',';let field='',row=[],rows=[],inQ=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(inQ&&text[i+1]==='"'){field+='"';i++;}else inQ=!inQ;}else if(c===delim&&!inQ){row.push(field);field='';}else if((c==='\n'||c==='\r')&&!inQ){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(v=>String(v).trim()!==''))rows.push(row);row=[];field='';}else field+=c;if(rows.length>10001)throw new Error('最多支援 10,000 筆資料。');}if(inQ)throw new Error('CSV 引號未正確封閉。');row.push(field);if(row.some(v=>String(v).trim()!==''))rows.push(row);if(rows.length<2)throw new Error('CSV 至少需要標題列及一筆資料。');const headers=rows.shift().map((h,i)=>(String(h).trim()||`欄位${i+1}`).slice(0,80));if(headers.length>40)throw new Error('最多支援 40 欄。');return {headers,rows:rows.map(r=>Object.fromEntries(headers.map((h,i)=>[h,r[i]||''])))};}
function numeric(x){const v=String(x??'').replace(/[$,，\s]/g,'').trim();return v&&/^-?\d+(\.\d+)?$/.test(v)?Number(v):NaN;}
function selectGuess(headers,pattern){return headers.find(h=>pattern.test(h))||'';}
function initCSV(obj){ui.csv=obj;ui.csvDate=selectGuess(obj.headers,/日期|date|時間/i);ui.csvValue=selectGuess(obj.headers,/金額|amount|數值|value|時數|分數/i)||obj.headers.find(h=>obj.rows.filter(r=>Number.isFinite(numeric(r[h]))).length>=obj.rows.length*.6)||'';ui.csvGroup=selectGuess(obj.headers,/類別|category|科目|subject|戶別|種類/i)||obj.headers[0];ui.csvStatus='全部';ui.csvOperation='sum';}
function demoCSV(){const t=localDay();const d=n=>addDay(t,n);const arr=[['日期','類別','金額','狀態','戶別'],[d(-50),'管理費',2800,'已繳','A-01'],[d(-50),'管理費',2800,'未繳','A-02'],[d(-45),'停車費',1200,'已繳','A-03'],[d(-30),'管理費',2800,'未繳','A-02'],[d(-25),'管理費',2800,'已繳','A-01'],[d(-20),'停車費',1200,'未繳','A-04'],[d(-15),'管理費',2800,'已繳','A-03'],[d(-10),'管理費',2800,'未繳','A-05'],[d(-5),'停車費',1200,'已繳','A-01'],[d(-1),'管理費',2800,'未繳','A-04']];const csv=toCSV(arr);initCSV(parseCSV(csv));toast('已載入 10 筆虛構財務示範資料。');}
function getCsvFiltered(){if(!ui.csv)return [];const status=selectGuess(ui.csv.headers,/^狀態$|status/i);return ui.csv.rows.filter(r=>ui.csvStatus==='全部'||!status||r[status]===ui.csvStatus);}
function csvAggregates(){const rows=getCsvFiltered(),map=new Map();for(const row of rows){const k=ui.csvGroup?String(row[ui.csvGroup]??'').trim()||'(空白)':'全部';const value=ui.csvOperation==='count'?1:numeric(row[ui.csvValue]);if(ui.csvOperation!=='count'&&!Number.isFinite(value))continue;if(!map.has(k))map.set(k,{name:k,count:0,sum:0});const x=map.get(k);x.sum+=value;x.count++;}return [...map.values()].map(x=>({...x,value:ui.csvOperation==='avg'?x.sum/x.count:ui.csvOperation==='count'?x.count:x.sum})).sort((a,b)=>b.value-a.value).slice(0,100);}
function csvTrend(){const rows=getCsvFiltered(),month=new Map();if(!ui.csvDate)return [];for(const row of rows){const day=normDate(row[ui.csvDate]);if(!day)continue;const key=day.slice(0,7);const v=ui.csvOperation==='count'?1:numeric(row[ui.csvValue]);if(!Number.isFinite(v))continue;const x=month.get(key)||{n:0,sum:0};x.sum+=v;x.n++;month.set(key,x);}return [...month].sort(([a],[b])=>a.localeCompare(b)).slice(-10).map(([m,v])=>({label:m.slice(2),value:ui.csvOperation==='avg'?v.sum/v.n:ui.csvOperation==='count'?v.n:v.sum,color:'#719be2'}));}

function answer(i){if(ui.answer!==null||!ui.activeQ)return;const q=BANK.find(x=>x.id===ui.activeQ);if(!q)return;ui.answer=i;const right=i===q.answer,prev=db.study.records[q.id]||{right:0,wrong:0,streak:0};const streak=right?(prev.streak||0)+1:0;const interval=right?[1,3,7,14,30][Math.min(4,streak-1)]:1;db.study.records[q.id]={right:prev.right+Number(right),wrong:prev.wrong+Number(!right),streak,due:addDay(localDay(),interval),last:localDay()};db.study.history.push({id:q.id,date:localDay(),time:new Date().toISOString(),subject:q.subject,correct:right,selected:i});save();render();}

function quickTask(num){const specs=[['今日 SOAP','病歷'],['晨會預習','課程'],['教學表單','行政'],['臨床技能練習','臨床技能']];ui.editTask=null;ui.taskForm=true;ui.page='clerk';render();const f=$$('#task-form');f.elements.title.value=specs[num][0];f.elements.category.value=specs[num][1];f.elements.due.value=localDay();$$('#task-form-section')?.scrollIntoView({behavior:'smooth',block:'center'});}
function toggleTask(id,checked){const t=db.clerk.tasks.find(x=>x.id===id);if(!t)return;const wasDone=t.done;t.done=checked;t.completed=checked?localDay():null;if(checked&&!wasDone&&t.repeat!=='none'){let next=t.due||localDay(),step=t.repeat==='daily'?1:7;do{next=addDay(next,step);}while(next<=localDay());db.clerk.tasks.push({...clone(t),id:uid(),due:next,done:false,completed:null,created:localDay()});toast(`已排入下一次任務：${fmtDay(next)}`);}save();render();}
function icalEscape(x){return String(x??'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');}
function exportICS(){const tasks=db.clerk.tasks.filter(t=>!t.done&&t.due);const now=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//ClerkStudio//ZH-TW//EN','CALSCALE:GREGORIAN'];for(const t of tasks){lines.push('BEGIN:VEVENT',`UID:${t.id}@clerkstudio.local`,`DTSTAMP:${now}`,`DTSTART;VALUE=DATE:${t.due.replace(/-/g,'')}`,`DTEND;VALUE=DATE:${addDay(t.due,1).replace(/-/g,'')}`,`SUMMARY:${icalEscape('[Clerk] '+t.title)}`,`DESCRIPTION:${icalEscape(t.category+' / '+(t.rotation||'')+' / '+t.note)}`,'END:VEVENT');}lines.push('END:VCALENDAR');download('Clerk_待辦行事曆.ics',lines.join('\r\n'),'text/calendar;charset=utf-8');toast(`已匯出 ${tasks.length} 項有期限的待辦事項。`);}
function exportStudy(){const rows=[['日期','時間UTC','題號','科目','是否答對','使用者選項'],...db.study.history.map(x=>[x.date,x.time||'',x.id,x.subject,x.correct?'答對':'答錯','ABCD'[x.selected]||''])];download('國考答題紀錄.csv',toCSV(rows),'text/csv;charset=utf-8');}
function exportTasks(){const rows=[['任務','類別','輪科','到期日','優先級','已完成','重複','備註'],...db.clerk.tasks.map(x=>[x.title,x.category,x.rotation,x.due,x.priority,x.done?'是':'否',x.repeat,x.note])];download('Clerk任務總表.csv',toCSV(rows),'text/csv;charset=utf-8');}
function exportAggregate(){if(!ui.csv)return;download('資料分類彙總.csv',toCSV([['類別','有效筆數','運算方式','結果'],...csvAggregates().map(g=>[g.name,g.count,ui.csvOperation,g.value.toFixed(2)])]),'text/csv;charset=utf-8');}
function exportBackup(){download('ClerkStudio_備份_'+localDay()+'.json',JSON.stringify({...db,exportedAt:new Date().toISOString()},null,2),'application/json;charset=utf-8');}
async function importBackup(file){if(!file)return;if(file.size>6e6){toast('備份檔案過大（上限 6 MB）。');return;}try{const v=JSON.parse(await file.text());if(v.version!==1||!v.study||!v.clerk||!Array.isArray(v.study.history)||!Array.isArray(v.study.bookmarks)||!v.study.records||!Array.isArray(v.clerk.tasks)||!Array.isArray(v.clerk.rotations))throw new Error('版本或格式不正確');if(!confirm('確定匯入？這會覆蓋目前的國考、輪訓與任務紀錄。'))return;db={version:1,study:{records:v.study.records,history:v.study.history,bookmarks:v.study.bookmarks},clerk:{tasks:v.clerk.tasks,rotations:v.clerk.rotations}};save();ui.activeQ=null;render();$$('#backup-dialog').close();toast('備份資料已還原。');}catch(e){toast('匯入失敗：'+e.message);}}
async function importClerkPack(file){
  if(!file)return;
  if(file.size>1000000){toast('輪訓匯入檔上限 1 MB。');return;}
  try{
    const obj=JSON.parse(await file.text());
    if(obj.version!==1||!obj.clerk||!Array.isArray(obj.clerk.tasks)||!Array.isArray(obj.clerk.rotations))throw new Error('輪訓檔格式不正確');
    if(obj.clerk.tasks.length>200||obj.clerk.rotations.length>100)throw new Error('輪訓資料筆數過多');
    const oldRotations=new Set(db.clerk.rotations.map(x=>[x.name,x.start,x.end].join('|')));
    const oldTasks=new Set(db.clerk.tasks.map(x=>[x.title,x.due,x.rotation].join('|')));
    const rotations=[],tasks=[];
    for(const r of obj.clerk.rotations){
      if(!r||typeof r.name!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(r.start)||!/^\d{4}-\d{2}-\d{2}$/.test(r.end)||r.start>r.end)continue;
      const item={id:uid(),name:r.name.slice(0,60),start:r.start,end:r.end,place:String(r.place||'').slice(0,80)};
      const key=[item.name,item.start,item.end].join('|');if(!oldRotations.has(key)){rotations.push(item);oldRotations.add(key);}
    }
    for(const t of obj.clerk.tasks){
      if(!t||typeof t.title!=='string'||!t.title.trim())continue;
      const due=String(t.due||'');if(due&&!/^\d{4}-\d{2}-\d{2}$/.test(due))continue;
      const item={id:uid(),title:t.title.trim().slice(0,100),category:CATEGORIES.includes(t.category)?t.category:'其他',due,priority:['low','medium','high'].includes(t.priority)?t.priority:'medium',repeat:['none','daily','weekly'].includes(t.repeat)?t.repeat:'none',rotation:String(t.rotation||'').slice(0,60),note:String(t.note||'').slice(0,300),done:!!t.done,created:localDay()};
      const key=[item.title,item.due,item.rotation].join('|');if(!oldTasks.has(key)){tasks.push(item);oldTasks.add(key);}
    }
    if(!rotations.length&&!tasks.length){toast('沒有新的輪訓或任務可合併。');return;}
    if(!confirm(`將新增 ${rotations.length} 個輪訓時段、${tasks.length} 個待辦；現有答題紀錄不受影響。確定嗎？`))return;
    db.clerk.rotations.push(...rotations);db.clerk.tasks.push(...tasks);save();render();$$('#backup-dialog').close();toast(`已合併 ${rotations.length} 個輪訓、${tasks.length} 項任務。`);
  }catch(e){toast('合併失敗：'+e.message);}
}
function clickHandler(e){const nav=e.target.closest('[data-page]');if(nav){navigate(nav.dataset.page);return;}const subj=e.target.closest('[data-subject]');if(subj){ui.subject=subj.dataset.subject;if(ui.subject!=='小兒科'&&ui.studyMode.startsWith('official'))ui.studyMode='due';ui.activeQ=null;ui.sessionSeen=[];render();return;}const filter=e.target.closest('[data-task-filter]');if(filter){ui.taskFilter=filter.dataset.taskFilter;render();return;}const answerBtn=e.target.closest('[data-answer]');if(answerBtn){answer(Number(answerBtn.dataset.answer));return;}
  const del=e.target.closest('[data-delete-task]');if(del){const t=db.clerk.tasks.find(x=>x.id===del.dataset.deleteTask);if(t&&confirm(`確定刪除「${t.title}」？`)){db.clerk.tasks=db.clerk.tasks.filter(x=>x.id!==t.id);save();render();}return;}
  const edit=e.target.closest('[data-edit-task]');if(edit){ui.editTask=edit.dataset.editTask;ui.taskForm=true;render();$$('#task-form-section')?.scrollIntoView({behavior:'smooth',block:'center'});return;}
  const rd=e.target.closest('[data-delete-rotation]');if(rd){if(confirm('確定刪除這個輪科時段？（任務不受影響）')){db.clerk.rotations=db.clerk.rotations.filter(x=>x.id!==rd.dataset.deleteRotation);save();render();}return;}
  const re=e.target.closest('[data-edit-rotation]');if(re){ui.editRotation=re.dataset.editRotation;ui.rotationForm=true;render();return;}
  const action=e.target.closest('[data-action]')?.dataset.action;if(!action)return;
  if(action.startsWith('quick-')){quickTask(Number(action.slice(-1)));return;}
  switch(action){case 'go-study':navigate('study');break;case 'go-clerk':navigate('clerk');break;case 'go-analytics':navigate('analytics');break;case 'new-task':ui.page='clerk';ui.taskForm=true;ui.editTask=null;render();$$('#task-form-section')?.scrollIntoView({behavior:'smooth',block:'center'});break;case 'cancel-task':ui.taskForm=false;ui.editTask=null;render();break;case 'new-rotation':ui.rotationForm=true;ui.editRotation=null;render();break;case 'cancel-rotation':ui.rotationForm=false;ui.editRotation=null;render();break;case 'next-question':pickQuestion();render();break;case 'stop-question':ui.activeQ=null;ui.answer=null;render();break;case 'toggle-bookmark':if(ui.activeQ){const i=db.study.bookmarks.indexOf(ui.activeQ);if(i<0)db.study.bookmarks.push(ui.activeQ);else db.study.bookmarks.splice(i,1);save();render();}break;case 'demo-csv':demoCSV();render();break;case 'clear-csv':ui.csv=null;render();break;case 'export-study':exportStudy();break;case 'export-tasks':exportTasks();break;case 'export-ics':exportICS();break;case 'export-aggregate':exportAggregate();break;}
}
document.addEventListener('click',clickHandler);
document.addEventListener('change',async e=>{const t=e.target;if(t.id==='study-mode'){ui.studyMode=t.value;ui.sessionSeen=[];ui.activeQ=null;render();}else if(t.matches('[data-task-toggle]'))toggleTask(t.dataset.taskToggle,t.checked);else if(['csv-date','csv-value','csv-group','csv-status','csv-operation'].includes(t.id)){ui[{ 'csv-date':'csvDate','csv-value':'csvValue','csv-group':'csvGroup','csv-status':'csvStatus','csv-operation':'csvOperation'}[t.id]]=t.value;render();}else if(t.id==='csv-file'){const file=t.files?.[0];if(!file)return;if(file.size>2e6){toast('CSV 最大 2 MB，請先縮小檔案。');return;}try{initCSV(parseCSV(await file.text()));render();toast(`已讀取 ${ui.csv.rows.length} 筆資料。`);}catch(err){toast('CSV 讀取失敗：'+err.message);} }else if(t.id==='import-all')await importBackup(t.files?.[0]);else if(t.id==='import-clerk')await importClerkPack(t.files?.[0]);});
document.addEventListener('submit',e=>{const f=e.target;if(f.id==='task-form'){e.preventDefault();const d=new FormData(f),title=String(d.get('title')||'').trim();if(!title){toast('請輸入任務名稱');return;}const obj={title:title.slice(0,100),due:String(d.get('due')||''),category:String(d.get('category')),priority:String(d.get('priority')),repeat:String(d.get('repeat')),rotation:String(d.get('rotation')||'').trim().slice(0,60),note:String(d.get('note')||'').trim().slice(0,300)};if(ui.editTask){const t=db.clerk.tasks.find(x=>x.id===ui.editTask);if(t)Object.assign(t,obj);save();toast('任務已更新。');}else{makeTask(obj);toast('新任務已建立。');}ui.taskForm=false;ui.editTask=null;render();}else if(f.id==='rotation-form'){e.preventDefault();const d=new FormData(f),obj={name:String(d.get('name')||'').trim().slice(0,60),start:String(d.get('start')||''),end:String(d.get('end')||''),place:String(d.get('place')||'').trim().slice(0,80)};if(!obj.name||!obj.start||!obj.end||obj.start>obj.end){toast('請確認科別名稱與開始／結束日期。');return;}if(ui.editRotation){Object.assign(db.clerk.rotations.find(x=>x.id===ui.editRotation)||{},obj);}else db.clerk.rotations.push({id:uid(),...obj});save();ui.rotationForm=false;ui.editRotation=null;render();toast('輪訓時間已儲存。');}});
$$('#backup-shortcut').addEventListener('click',()=>$$('#backup-dialog').showModal());
$$('#backup-top').addEventListener('click',()=>$$('#backup-dialog').showModal());
$$('#export-all').addEventListener('click',exportBackup);
